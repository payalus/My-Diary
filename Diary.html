<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
      }
      .red {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        border-style: solid;
        background-image: url(image/Gemini_Generated_Image_kjn1k0kjn1k0kjn1.jpeg);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        box-sizing: border-box;
      }
      .yellow {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        width: 100px;
        height: 100px;
        border-style: solid;
        background-color: yellow;
      }
      .pas {
        width: 50px;
      }
      .pas::placeholder {
        font-size: 8px;
        -top: 3px;
        padding-bottom: 3px;
      }
      p {
        margin-top: 0px;
      }
    </style>
  </head>
  <body>
    <div class="red">
      <div  class="yellow">
        <p>My Diary</p>
        <input class="pas" type="text" placeholder="passoward">
      </div>
    </div>
  </body>
</html>
