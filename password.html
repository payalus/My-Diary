<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="password.css">
  </head>
  <body>
    <div class="red">
      <div  class="yellow">
        <p>My Diary</p>
        <div class="open">
          <input class="pas" id="js-pass" type="text" placeholder="passoward" onkeydown="">
          <button onclick="
            checkpassoward(); id='btn'">Open Diary
          </button>
        </div>
        <div id="ul-el"></div>
      </div>
    </div>
    <script src="password.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
    <script>
      const jsPass = document.getElementById("js-pass");
      const encrypted = CryptoJS.AES.encrypt(jsPass.value, 'secret key').toString();
      const sotrepassword = localStorage.getItem('diarypassword');
      function checkpassoward() {
        if (!sotrepassword) {
          localStorage.setItem('diarypassword', encrypted);
          window.location.href = 'diary.html'
        } else if (sotrepassword === encrypted) {
          window.location.href = 'diary.html'
        } else {
          alert('wrong password');
        }
      }
    </script>
  </body>
</html>
